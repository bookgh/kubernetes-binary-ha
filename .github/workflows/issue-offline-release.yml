name: Issue 驱动的离线资源包构建与 Release 发布

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      version:
        description: Kubernetes 版本号（例如 v1.37.2）
        required: true
        type: string

permissions:
  contents: write
  issues: read

concurrency:
  group: offline-release-${{ github.event.issue.number || inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'build-offline') &&
       github.event.issue.pull_request == null)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: 安装 YAML 解析依赖
        run: python3 -m pip install --break-system-packages --disable-pip-version-check PyYAML==6.0.2

      - name: 构建并发布离线资源
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: bash scripts/ci/build-offline-release.sh
